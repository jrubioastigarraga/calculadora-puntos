<div class="auth-wrap">
  <div class="card auth-card shadow-lg">
    <div class="card-body p-4 p-md-5">
      <div class="d-flex align-items-center gap-3 mb-3">
        <span class="logo"><i class="bi bi-check2-circle"></i></span>
        <div>
          <strong class="d-block">Hezkuntzako datuak</strong>
          <small class="text-muted">Euskadi · traslados docentes</small>
        </div>
      </div>

      <h1 class="h3 mb-1">Acceso restringido</h1>
      <p class="text-muted mb-4">
        Introduce tus credenciales para consultar la calculadora y los datos de traslados.
      </p>

      @if (error) {
        <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
      }

      <form (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="user">Usuario</label>
          <input
            id="user"
            class="form-control"
            name="user"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            [(ngModel)]="username"
            required
            autofocus
          />
        </div>
        <div class="mb-4">
          <label class="form-label" for="pass">Contraseña</label>
          <div class="input-group">
            <input
              id="pass"
              class="form-control"
              name="pass"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password"
              [(ngModel)]="password"
              required
            />
            <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword">
              {{ showPassword ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
          {{ loading ? 'Comprobando…' : 'Entrar' }}
        </button>
      </form>

      <p class="text-muted small text-center mt-4 mb-0">
        Herramienta de ayuda sin carácter oficial. ·
        <a routerLink="/faq">Preguntas frecuentes</a>
      </p>
    </div>
  </div>
</div>
