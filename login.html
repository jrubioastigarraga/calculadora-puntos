<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso · Hezkuntzako datuak</title>
<meta name="theme-color" content="#4d0d22">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237a1738'/%3E%3Cpath d='M18 33l9 9 19-20' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7eff1;
    --surface: #ffffff;
    --ink: #241419;
    --muted: #7d6b70;
    --line: #e7d8dd;
    --accent: #7a1738;
    --accent-dark: #4a0c20;
    --accent-soft: #f6e7ec;
    --danger: #a32a2d;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(45, 20, 25, .05), 0 12px 28px -18px rgba(45, 20, 25, .35);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(1100px 520px at 15% -10%, #f1dbe2 0%, transparent 60%),
      radial-gradient(900px 460px at 105% 110%, #ead2da 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px 32px 28px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .logo {
    width: 42px; height: 42px;
    flex: none;
    border-radius: 12px;
    background: var(--accent);
    display: grid;
    place-items: center;
    color: #fff;
  }
  .brand strong { display: block; font-size: 16px; letter-spacing: -.01em; }
  .brand small { display: block; color: var(--muted); font-size: 12px; }
  h1 { font-size: 22px; letter-spacing: -.015em; margin: 0 0 6px; }
  .lede { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input[type="text"], input[type="password"] {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 64px; }
  .toggle {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .submit {
    width: 100%;
    height: 46px;
    margin-top: 6px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .submit:hover { background: var(--accent-dark); }
  .submit:disabled { opacity: .65; cursor: progress; }
  .submit:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  .error {
    display: none;
    margin: 0 0 16px;
    padding: 10px 12px;
    border: 1px solid #ecc4c5;
    border-radius: 10px;
    background: #fdf0f0;
    color: var(--danger);
    font-size: 13px;
  }
  .error.show { display: block; }
  .foot {
    margin: 22px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5"></rect><path d="M8 7h8M8 11h3M13 11h3M8 15h3M13 15h3M8 19h8"></path></svg>
    </span>
    <span>
      <strong>Hezkuntzako datuak</strong>
      <small>Euskadi · traslados docentes</small>
    </span>
  </div>

  <h1>Acceso restringido</h1>
  <p class="lede">Introduce tus credenciales para consultar la calculadora y los datos de traslados.</p>

  <p class="error" id="error" role="alert" aria-live="assertive"></p>

  <form id="form" novalidate>
    <div class="field">
      <label for="user">Usuario</label>
      <input id="user" name="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </div>
    <div class="field">
      <label for="pass">Contraseña</label>
      <div class="password-wrap">
        <input id="pass" name="pass" type="password" autocomplete="current-password" required>
        <button type="button" class="toggle" id="toggle" aria-label="Mostrar contraseña">Mostrar</button>
      </div>
    </div>
    <button type="submit" class="submit" id="submit">Entrar</button>
  </form>

  <p class="foot">Herramienta de ayuda sin carácter oficial.</p>
</main>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
(() => {
  'use strict';

  const cfg = window.APP_CONFIG;
  const form = document.getElementById('form');
  const errorBox = document.getElementById('error');
  const submit = document.getElementById('submit');
  const userInput = document.getElementById('user');
  const passInput = document.getElementById('pass');
  const toggle = document.getElementById('toggle');

  if (!cfg || !window.supabase) {
    errorBox.textContent = 'No se ha podido cargar la configuración de acceso.';
    errorBox.classList.add('show');
    submit.disabled = true;
    return;
  }

  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
  });

  const safeNext = () => {
    const raw = new URLSearchParams(location.search).get('next') || 'index.html';
    let decoded = raw;
    try { decoded = decodeURIComponent(raw); } catch (error) { /* se queda igual */ }
    // Solo se permite volver a una pantalla del propio sitio.
    if (!/^[A-Za-z0-9._-]+\.html(\?[^#]*)?(#.*)?$/.test(decoded)) return 'index.html';
    if (decoded === cfg.LOGIN_PAGE) return 'index.html';
    return decoded;
  };

  const showError = (message) => {
    errorBox.textContent = message;
    errorBox.classList.add('show');
  };

  const clearError = () => {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  };

  const emailFor = (user) => {
    const value = String(user || '').trim();
    if (!value) return '';
    return value.includes('@') ? value : value + '@' + cfg.EMAIL_DOMAIN;
  };

  const enter = () => location.replace(safeNext());

  // Si ya hay sesión, no se muestra el formulario.
  sb.auth.getSession().then(({ data }) => {
    if (data && data.session) enter();
  });

  toggle.addEventListener('click', () => {
    const visible = passInput.type === 'text';
    passInput.type = visible ? 'password' : 'text';
    toggle.textContent = visible ? 'Mostrar' : 'Ocultar';
    toggle.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
    passInput.focus();
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearError();

    const email = emailFor(userInput.value);
    const password = passInput.value;
    if (!email || !password) {
      showError('Escribe el usuario y la contraseña.');
      (!email ? userInput : passInput).focus();
      return;
    }

    submit.disabled = true;
    submit.textContent = 'Comprobando…';

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      const message = /invalid login credentials/i.test(error.message)
        ? 'Usuario o contraseña incorrectos.'
        : /email not confirmed/i.test(error.message)
          ? 'La cuenta no está confirmada. Contacta con la persona administradora.'
          : 'No se ha podido iniciar sesión: ' + error.message;
      showError(message);
      submit.disabled = false;
      submit.textContent = 'Entrar';
      passInput.select();
      return;
    }

    enter();
  });
})();
</script>
</body>
</html>
